# The credentials this company's hangar uses, listed by name instead of hangar's default `find` by prefix, so a new
# credential is a reviewed line here and in policy/credentials/. Each key becomes the file
# /var/run/hangar-secrets/<name>, which a credential declared with `source: file:/var/run/hangar-secrets/<name>`
# reads each time it is used. The remote keys are your secret manager's names; change them, not the secretKeys.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ExternalSecret, name: hangar-credentials, namespace: hangar}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: hangar-credentials
        namespace: hangar
      spec:
        dataFrom: null
        data:
          - secretKey: github-app            # JSON {app_id, installation_id, private_key}: PRs, merges, the gateway
            remoteRef: {key: agent-factory-github-app}
          - secretKey: jira-api-token        # the Jira service account's API token (Cloud) or PAT (Data Center)
            remoteRef: {key: agent-factory-jira-api-token}
          - secretKey: jira-webhook-secret   # the Jira admin webhook's secret
            remoteRef: {key: agent-factory-jira-webhook-secret}
          - secretKey: bot-hook-key          # signs hangar.event/v1 webhooks to the Symphony bot
            remoteRef: {key: agent-factory-bot-hook-key}
          - secretKey: claude-code-team      # the team's Claude Code login for agent turns
            remoteRef: {key: agent-factory-claude-code-team}
