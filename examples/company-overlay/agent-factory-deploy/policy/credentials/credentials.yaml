# hangar credentials whose values are files mounted from your secret manager (components/credentials). `hangar apply`
# registers each one by name; the value is never in git, in hangar's database or in this file.
schema: hangar.credential/v1
name: github-app
harness: git
kind: github_app
source: file:/var/run/hangar-secrets/github-app
description: The factory's GitHub App (contents and pull_requests write on the service repos)
---
schema: hangar.credential/v1
name: jira-api-token
harness: custom
kind: api_key
source: file:/var/run/hangar-secrets/jira-api-token
description: Jira service account for intake comments and transitions
---
schema: hangar.credential/v1
name: jira-webhook-secret
harness: custom
kind: generic
source: file:/var/run/hangar-secrets/jira-webhook-secret
---
schema: hangar.credential/v1
name: bot-hook-key
harness: custom
kind: generic
source: file:/var/run/hangar-secrets/bot-hook-key
description: HMAC key for hangar.event/v1 webhooks to the Symphony bot
---
schema: hangar.credential/v1
name: claude-code-team
harness: claude-code
kind: oauth_token
source: file:/var/run/hangar-secrets/claude-code-team
description: The team's Claude Code login (claude setup-token) for agent turns
