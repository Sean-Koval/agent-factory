# hangar credentials whose values are files mounted from your secret manager (components/credentials). `hangar apply`
# registers each one by name; the value is never in git, in hangar's database or in this file. Secrets that no agent
# harness uses (Jira, webhook keys) are `harness: webhook, kind: generic`, as hangar's docs/intake.md does; a team
# credential for agent turns must be an API key, since a subscription login belongs to one person.
schema: hangar.credential/v1
name: github-app
harness: git
kind: github_app
source: file:/var/run/hangar-secrets/github-app
description: The factory's GitHub App (contents and pull_requests write on the service repos)
---
schema: hangar.credential/v1
name: jira-api-token
harness: webhook
kind: generic
source: file:/var/run/hangar-secrets/jira-api-token
description: Jira service account for intake comments and transitions
---
schema: hangar.credential/v1
name: jira-webhook-secret
harness: webhook
kind: generic
source: file:/var/run/hangar-secrets/jira-webhook-secret
---
schema: hangar.credential/v1
name: bot-hook-key
harness: webhook
kind: generic
source: file:/var/run/hangar-secrets/bot-hook-key
description: HMAC key for hangar.event/v1 webhooks to the Symphony bot
---
schema: hangar.credential/v1
name: anthropic-team
harness: claude-code
kind: api_key
source: file:/var/run/hangar-secrets/anthropic-team
description: The team's Anthropic API key for agent turns (a subscription login can't be a team credential)
