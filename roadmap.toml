# Roadmap themes for docs/roadmap.md. scripts/roadmap.py reads this file, fetches issue state
# from the GitHub REST API and writes generated/roadmap.md (CI only, never committed).
#
# Issue references are "<repo key>#<number>" or a range "<repo key>#<first>-<last>".
# A theme may also take every issue in its phase's milestone that carries `label`.
# Open issues that no theme lists (epics aside) appear under "Unsorted", so nothing hides:
# when a new issue is filed, add it to a theme here.

# Repositories, in display order. `slugs` are tried in order, so a rename can list the new
# name first while the old one still answers. Private repositories are skipped unless the
# script runs with --include-private (the published site never shows them).
[[repo]]
key = "hangar"
name = "hangar"
slugs = ["Sean-Koval/hangar"]
epics = [119, 153]

[[repo]]
key = "flightdeck"
name = "flightdeck"
slugs = ["Sean-Koval/flightdeck"]
epics = [1]

[[repo]]
key = "ai-dlc"
name = "ai-dlc"
slugs = ["Sean-Koval/ai-dlc"]
epics = [189]

[[repo]]
key = "workspace"
name = "Tower"
slugs = ["Sean-Koval/tower"]
epics = [7]

[[repo]]
key = "spaceport"
name = "Spaceport"
slugs = ["Sean-Koval/spaceport"]
epics = [10]

[[repo]]
key = "agent-factory"
name = "agent-factory"
slugs = ["Sean-Koval/agent-factory"]
epics = []

# Phases match milestones by title prefix ("P2 Adopt & capture (wk 3-4)" starts with "P2").
[[phase]]
key = "P1"
title = "P1 · Safe release"
when = "weeks 1-2"
milestone = "P1"
done = "Security fixes, credential policy and grader isolation are in; CI is green; two engineers use hangar on one repo."

[[phase.theme]]
