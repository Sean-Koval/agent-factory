<!-- @dsCard group="Fleet" height=980 subtitle="A box per sandbox: task, owner, stage track, time left, one action" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Fleet bays</title></head>
<body>
<main class="af-stack af-stack--block" style="padding:24px;gap:28px" id="bays-root"></main>
<script>
(function () {
  var ENVS = [['base-codex', 'acme/checkout-api'], ['rust-1.83-gpu', 'acme/inference']];
  // code, env, state, stage (0 plan .. 3 PR, -1 none), work, kind, owner, harness, age min, hours left, note, word
  var RAW = [
    ['3MX9', 0, 'approval', 3, 'Push the refunds migration to main', 'job', 'sean', 'codex', 41, 2.1, ['Held', 'Push to main held by require-approval-main-push.']],
    ['YQZT', 0, 'approval', 2, 'Fix the flaky payments test', 'job', 'priya', 'claude-code', 26, 3.5, ['Question', 'Retry the whole test, or only the client call?'], 'Needs input'],
    ['9KD4', 0, 'denied', 2, 'Rotate the Stripe key in CI', 'job', 'omar', 'codex', 12, 3.8, ['Policy', 'Denied by deny-secrets-egress. No receipt issued.']],
    ['7Q2K', 0, 'running', 1, 'Add pagination to GET /orders', 'job', 'priya', 'claude-code', 5, 3.9],
    ['QLJG', 0, 'running', 2, 'orders-pagination', 'session', 'priya', 'claude-code', 18, 3.6],
    ['KQ0D', 0, 'running', 1, 'tax-rules', 'session', 'marco', 'codex', 24, 3.4],
    ['C5KJ', 0, 'running', 2, 'partial-refunds', 'session', 'sean', 'codex', 27, 3.5],
    ['FA1V', 0, 'queued', -1, 'Add rate limits to /refunds', 'job', 'dana', 'codex', 1, 4],
    ['0BZP', 0, 'off', -1, 'refunds-spike', 'session', 'sean', 'codex', 95, 3.6, null, 'Paused'],
    ['6HXD', 1, 'running', 2, 'Port the tokenizer to SIMD', 'job', 'priya', 'claude-code', 38, 3.1],
    ['98AX', 1, 'running', 1, 'bench-flash-attn', 'session', 'omar', 'codex', 22, 3.6],
    ['R0SS', 1, 'running', 3, 'Fix the borrow error in the planner', 'job', 'dana', 'claude-code', 17, 3.7],
    ['8C1T', 1, 'queued', -1, 'GPU smoke tests', 'job', 'li', 'codex', 1, 4]
  ];
  var WORD = { running: 'Running', queued: 'Starting', approval: 'Needs approval', failed: 'Failed', denied: 'Denied', off: 'Paused' };
  var STAGES = ['Plan', 'Edit', 'Test', 'PR'];
  var ENV_IC = '<svg class="af-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l7 3.5-7 3.5-7-3.5z"/><path d="M3 10l7 3.5 7-3.5M3 13.5 10 17l7-3.5"/></svg>';
  var GPU_IC = '<svg class="af-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="9"/><circle cx="12.5" cy="9" r="2.5"/><path d="M5.5 7.5v3M3.5 17h6"/></svg>';
  var PLUS = '<svg class="af-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>';
  function age(m) { return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
  function action(r, w) {
    if (r[2] === 'approval') return '<button type="button" class="af-btn af-btn--primary af-btn--sm">' + (w === 'Needs input' ? 'Answer' : 'Review') + '</button>';
    if (r[2] === 'failed') return '<button type="button" class="af-btn af-btn--secondary af-btn--sm">Retry</button>';
    if (r[2] === 'denied') return '<button type="button" class="af-btn af-btn--secondary af-btn--sm">Decision</button>';
    if (r[2] === 'off') return '<button type="button" class="af-btn af-btn--ghost af-btn--sm">Resume</button>';
    if (r[2] === 'queued') return '<button type="button" class="af-btn af-btn--ghost af-btn--sm">Open job</button>';
    return '<button type="button" class="af-btn af-btn--ghost af-btn--sm">Terminal</button>';
  }
  function bay(r, selected) {
    var w = r[11] || WORD[r[2]];
    var track = STAGES.map(function (s, i) {
      var c = r[3] < 0 || i > r[3] ? '' : i < r[3] ? ' af-track__seg--done' : ' af-track__seg--now';
      return '<span class="af-track__seg' + c + '"><i></i>' + s + '</span>';
    }).join('');
    var note = r[10] ? '<p class="af-bay__note"><b>' + r[10][0] + '</b>' + r[10][1] + '</p>' : '';
    var left = r[2] === 'off' ? 'paused' : r[9] + ' h left';
    return '<article class="af-bay af-bay--' + r[2] + (selected ? ' is-selected' : '') + '" aria-label="HGR-' + r[0] + ', ' + w + '">'
      + '<div class="af-bay__top"><span class="af-bay__id">HGR-' + r[0] + '</span><span class="af-status af-status--' + r[2] + '"><i class="af-status__mark"></i>' + w + '</span></div>'
      + '<p class="af-bay__title">' + r[4] + '</p>'
      + '<span class="af-meta"><span class="af-meta__item"><span class="af-meta__key">' + (r[5] === 'job' ? 'job by' : 'session of') + '</span><span class="af-meta__val">' + r[6] + '</span></span>'
      + '<span class="af-meta__item"><span class="af-meta__key">harness</span><span class="af-meta__val">' + r[7] + '</span></span></span>'
      + '<div class="af-track" aria-label="' + (r[3] < 0 ? 'Not started' : 'Stage ' + STAGES[r[3]]) + '">' + track + '</div>'
      + note
      + '<div class="af-bay__foot"><span class="af-bay__time"><span><b>' + age(r[8]) + '</b> · ' + left + '</span>'
      + '<span class="af-bay__left" aria-hidden="true"><i style="width:' + (r[2] === 'off' ? 0 : Math.round(r[9] / 4 * 100)) + '%"></i></span></span>' + action(r, w) + '</div>'
      + '</article>';
  }
  document.getElementById('bays-root').innerHTML = ENVS.map(function (e, i) {
    var rows = RAW.filter(function (r) { return r[1] === i; });
    return '<section class="af-stack" style="gap:12px" aria-label="' + e[0] + '">'
      + '<div class="af-fleet__pool-head">' + (i === 1 ? GPU_IC : ENV_IC) + '<span class="af-fleet__pool-name">' + e[0] + '</span>'
      + '<span class="af-meta"><span class="af-meta__item af-meta__item--strong"><span class="af-meta__key">sandboxes</span><span class="af-meta__val">' + rows.length + '</span></span><span class="af-meta__item"><span class="af-meta__key">repo</span><span class="af-meta__val">' + e[1] + '</span></span></span></div>'
      + '<div class="af-bays">' + rows.map(function (r) { return bay(r, r[0] === 'C5KJ'); }).join('')
      + '<button type="button" class="af-bay af-bay--new">' + PLUS + 'Start in ' + e[0] + '</button></div></section>';
  }).join('');
})();
</script>
</body></html>
