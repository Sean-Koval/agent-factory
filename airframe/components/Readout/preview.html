<!-- @dsCard group="Foundations" height=370 subtitle="Mono digits on unlit cells inside a recessed display window" -->
<!doctype html><html><head><meta charset="utf-8"><title>Readout</title></head><body>
<main class="af-stack af-stack--block" style="padding:24px">
  <section class="af-stack">
    <span class="af-lbl">Large<span class="af-lbl__sub">34–60 px, one per window</span></span>
    <div class="af-panel" style="padding:12px">
      <div class="af-readouts" style="--af-cols:2">
        <div class="af-window"><span class="af-readout af-readout--l"><b>2</b><b class="af-readout__p">,</b><b>4</b><b>8</b><b>1</b></span><span class="af-window__key">Sandboxes started this week</span></div>
        <div class="af-window"><span class="af-readout af-readout--l"><b>1</b><b class="af-readout__p">.</b><b>8</b><span class="af-readout__unit">s</span></span><span class="af-window__key">To resume from a snapshot</span></div>
      </div>
    </div>
  </section>
  <div class="af-grid af-grid--2" style="gap:28px 24px;align-items:start">
    <section class="af-stack">
      <span class="af-lbl">Medium<span class="af-lbl__sub">30 px, windows in a row</span></span>
      <div class="af-panel" style="padding:12px">
        <div class="af-readouts">
          <div class="af-window"><span class="af-readout af-readout--m"><b>3</b><b>8</b></span><span class="af-window__key">Held for a human</span></div>
          <div class="af-window"><span class="af-readout af-readout--m"><b>3</b><b>6</b></span><span class="af-window__key">Approved</span></div>
          <div class="af-window"><span class="af-readout af-readout--m"><b>0</b></span><span class="af-window__key">Outside policy</span></div>
        </div>
      </div>
    </section>
    <section class="af-stack">
      <span class="af-lbl">Small<span class="af-lbl__sub">20 px, beside a key</span></span>
      <div class="af-panel" style="padding:12px">
        <div class="af-readouts">
          <div class="af-window"><span class="af-readout af-readout--s"><b class="af-readout__p">$</b><b>1</b><b>4</b><b>2</b><b class="af-readout__p">.</b><b>1</b><b>8</b></span><span class="af-window__key">Spend today</span></div>
          <div class="af-window"><span class="af-readout af-readout--s"><b>0</b><b>0</b><b class="af-readout__p">:</b><b>4</b><b>1</b><b class="af-readout__p">:</b><b>0</b><b>7</b></span><span class="af-window__key">Held</span></div>
          <div class="af-window"><span class="af-readout af-readout--s"><b>6</b><b>1</b><b class="af-readout__p">%</b></span><span class="af-window__key">CPU avg</span></div>
        </div>
      </div>
    </section>
  </div>
</main>
</body></html>
