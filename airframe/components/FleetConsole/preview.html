const S = { view: new URLSearchParams(location.search).get("view") || "list", open: new URLSearchParams(location.search).get("open"), deck: 0 };

const queue = () => A.filter((a) => (a.lit || a.red) && !a.acked).sort((x, y) => (x.lit === y.lit ? (x.exp || 0) - (y.exp || 0) : x.lit ? -1 : 1));

const app = document.getElementById("app");
let NAV = null;

  <section class="af-deck" aria-label="Needs you" id="needs">

}
function rerender() { const f = document.activeElement, id = f && f.id, v = f && f.tagName === "TEXTAREA" ? f.value : null; render(); if (id) { const n = document.getElementById(id); if (n) { n.focus({ preventScroll: true }); if (v != null) n.value = v; } } }

render();
if (S.open) { const u = app.querySelector(`.af-agent[data-id="${S.open}"]`); if (u) { u.classList.add("is-open"); u.querySelector("[aria-expanded]").setAttribute("aria-expanded", "true"); } }
