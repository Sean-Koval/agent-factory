name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # daily: rebuild the roadmap from issue state and republish

permissions:
  contents: read
  issues: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install zensical==0.0.71 playwright==1.55.0 fonttools==4.65.0 uharfbuzz==0.56.3 pillow==12.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build diagrams, brand surfaces, deck (with PDF), roadmap data and site
        env:
          # Public repositories only; private ones are skipped. Fail rather than publish a
          # placeholder roadmap when GitHub cannot be read.
          GITHUB_TOKEN: ${{ github.token }}
          ROADMAP_ARGS: --strict
        run: |
          python3 scripts/diagrams.py
          python3 scripts/banners.py
          python3 scripts/build_deck.py --pdf
          sh scripts/build_site.sh
      - name: Diagrams, brand SVGs and deck are committed up to date; the roadmap data is not committed
        run: |
          git diff --exit-code -- docs/assets/diagrams/*.svg brand docs/assets/brand deck/index.html
          test -z "$(git ls-files generated)"
      - name: Roadmap in the job summary
        run: grep -A40 '^## Progress' generated/roadmap.md | sed '/^## Epics/,$d' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
