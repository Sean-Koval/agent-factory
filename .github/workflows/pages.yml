name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install zensical==0.0.71 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Build diagrams, deck (with PDF) and site
        run: |
          python3 scripts/diagrams.py
          python3 scripts/build_deck.py --pdf
          sh scripts/build_site.sh
      - name: Diagrams and deck are committed up to date
        run: git diff --exit-code -- docs/assets/diagrams/*.svg deck/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
