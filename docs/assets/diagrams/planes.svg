<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="The agent factory at a glance">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot, #262626); }
</style>
<defs><marker id="the-agent-factory-at-a-g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1200" height="800"/><pattern id="the-agent-factory-at-a-g-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle class="dot" cx="4" cy="4" r="1.1"/></pattern><rect x="900" y="20" width="300" height="70" fill="url(#the-agent-factory-at-a-g-dots)"/><text class="title" x="40" y="48" text-anchor="start">The agent factory at a glance</text><text class="lbl" x="40" y="72" text-anchor="start">DEFINE  ·  RUN  ·  JUDGE  ·  GOVERN</text><rect class="box" x="110" y="110" width="520" height="128" rx="3"/><rect x="110" y="110" width="520" height="2" fill="var(--af-p-aidlc, #69C27E)"/><text class="lbl" x="128" y="136">AI-DLC  +  TEAM HARNESS REPO</text><text class="name" x="128" y="158">Define</text><text class="body" x="128" y="180">ai-dlc authors the team workflow plugin and provisions machines</text><text class="body" x="128" y="198">The team harness repo holds harness.lock and native files</text><text class="body" x="128" y="216">One identity everywhere: harness_digest</text><rect class="box-hub" x="110" y="300" width="520" height="146" rx="3"/><rect x="110" y="300" width="520" height="2" fill="var(--af-p-hangar, #EE8F63)"/><text class="lbl" x="128" y="326">HANGAR</text><text class="name" x="128" y="348">Run</text><text class="body" x="128" y="370">Doors in, admission, intake posture, taint tracking</text><text class="body" x="128" y="388">Sandboxes, sessions, jobs and experiment trials on GKE</text><text class="body" x="128" y="406">Sealed graders; infrastructure errors retried and excluded</text><text class="body" x="128" y="424">Trusted verify, gateway push, landing on approval</text><rect class="box" x="110" y="508" width="520" height="128" rx="3"/><rect x="110" y="508" width="520" height="2" fill="var(--af-p-flightdeck, #D98CD2)"/><text class="lbl" x="128" y="534">FLIGHTDECK</text><text class="name" x="128" y="556">Judge</text><text class="body" x="128" y="578">Reads runs from a Parquet data plane, never from live hangar</text><text class="body" x="128" y="596">Paired statistics, behavior specs, nightly ADR checks</text><text class="body" x="128" y="614">Reports and promotion evidence posted on PRs</text><rect class="box" x="770" y="110" width="380" height="128" rx="3"/><text class="lbl" x="788" y="136">MANY DOORS</text><text class="name" x="788" y="158">Doors</text><text class="body" x="788" y="180">Jira “Ready for agent”</text><text class="body" x="788" y="198">GitHub label or Projects column</text><text class="body" x="788" y="216">Slack @hangar · MCP from laptops · schedules</text><rect class="box" x="770" y="300" width="380" height="146" rx="3"/><rect x="770" y="300" width="380" height="2" fill="var(--af-p-workspace, #C5A93B)"/><text class="lbl" x="788" y="326">GOVERNED WORKSPACE</text><text class="name" x="788" y="348">Govern</text><text class="body" x="788" y="370">Cedar rules and human approvals</text><text class="body" x="788" y="388">The approver is never the requester</text><text class="body" x="788" y="406">Passports and signed receipts</text><text class="body" x="788" y="424">Fails closed: off, shadow, enforce</text><rect class="box" x="770" y="508" width="380" height="128" rx="3"/><text class="lbl" x="788" y="534">GITHUB</text><text class="name" x="788" y="556">One gate: the PR</text><text class="body" x="788" y="578">Tainted work opens as a draft</text><text class="body" x="788" y="596">A second human approves the exact SHA</text><text class="body" x="788" y="614">Questions and reviews reach people in Slack</text><rect class="box-ext" x="110" y="690" width="1040" height="72" rx="3"/><rect x="110" y="690" width="1040" height="2" fill="var(--af-p-spaceport, #B199F4)"/><text class="name-s" x="128" y="716">Capabilities</text><text class="body" x="128" y="738">MCP servers bound into sandboxes when they are claimed: Spaceport data products, internal tools, docs search</text><path class="edge" d="M280 238V298" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="294" y="264" text-anchor="start">thaw: pin the harness,</text><text class="elabel" x="294" y="282" text-anchor="start">check drift on turn 1</text><path class="edge" d="M220 446V506" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="234" y="472" text-anchor="start">outbox</text><text class="elabel" x="234" y="490" text-anchor="start">hangar.run/v1</text><path class="edge" d="M510 508V448" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="496" y="472" text-anchor="end">trials</text><text class="elabel" x="496" y="490" text-anchor="end">hangar.experiment/v1</text><path class="edge" d="M110 572H70V174H108" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="60" y="373" text-anchor="middle" transform="rotate(-90 60 373)">report, then promote the stable channel</text><path class="edge" d="M770 174H706V330H632" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="696" y="250" text-anchor="middle" transform="rotate(-90 696 250)">work items</text><path class="edge" d="M630 372H768" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="700" y="364" text-anchor="middle">decide</text><path class="edge" d="M770 412H632" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="700" y="432" text-anchor="middle">receipt</text><path class="edge" d="M630 432H700V572H768" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="708" y="524" text-anchor="start">push,</text><text class="elabel" x="708" y="542" text-anchor="start">open PR</text><path class="edge" d="M630 442H650V688" marker-end="url(#the-agent-factory-at-a-g-arrow)"/><text class="elabel" x="642" y="672" text-anchor="end">tools over MCP</text></svg>
