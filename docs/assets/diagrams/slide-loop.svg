<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" role="img" aria-labelledby="the-harness-improvement--title the-harness-improvement--desc"><title id="the-harness-improvement--title">The harness improvement loop</title><desc id="the-harness-improvement--desc">A clockwise loop of five steps around one identity, harness_digest. 1: change a skill, hook or plugin in the harness. 2: freeze a good run into harness.lock. 3: experiment, stable against candidate, paired. 4: report a verdict with intervals on the pull request. 5: promote by moving stable, guarded by drift checks.</desc>
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #424242); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
  .af-d .human { fill: var(--af-status-approval, #FF8A3D); }
  .af-d .ic { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; }
</style>
<defs><marker id="the-harness-improvement--arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1280" height="600"/>
<style>
  .af-d .name { font-size: 22px; }
  .af-d .body { font-size: 16px; }
  .af-d .lbl { font-size: 12.5px; }
  .af-d .elabel { font-size: 15px; }
</style>
<text class="name" x="640" y="312" text-anchor="middle">harness_digest</text><text class="lbl" x="640" y="342" text-anchor="middle">One identity from lock to report</text><path class="edge" d="M663.1 111.3A210 210 0 0 1 831.4 233.6" marker-end="url(#the-harness-improvement--arrow)"/><circle cx="640" cy="110" r="9" fill="var(--af-fg-subtle, #8A8A8A)"/><text class="name" x="640.0" y="60.0" text-anchor="middle">1  Change</text><text class="body" x="640.0" y="86.0" text-anchor="middle">a skill, hook or plugin in the harness</text><path class="edge" d="M845.6 277.4A210 210 0 0 1 781.3 475.3" marker-end="url(#the-harness-improvement--arrow)"/><circle cx="840" cy="255" r="9" fill="var(--af-product-hangar, #24C1C9)"/><text class="name" x="865.7218684219822" y="251.10643118126103" text-anchor="start">2  Freeze</text><text class="body" x="865.7218684219822" y="277.10643118126103" text-anchor="start">a good run into harness.lock</text><path class="edge" d="M744.0 502.4A210 210 0 0 1 536.0 502.4" marker-end="url(#the-harness-improvement--arrow)"/><circle cx="763" cy="490" r="9" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="name" x="789.4349029814193" y="507.89356881873897" text-anchor="start">3  Experiment</text><text class="body" x="789.4349029814193" y="533.8935688187389" text-anchor="start">stable vs candidate, paired</text><path class="edge" d="M498.7 475.3A210 210 0 0 1 434.4 277.4" marker-end="url(#the-harness-improvement--arrow)"/><circle cx="517" cy="490" r="9" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="name" x="490.5650970185807" y="507.89356881873897" text-anchor="end">4  Report</text><text class="body" x="490.5650970185807" y="533.8935688187389" text-anchor="end">verdict with intervals on the PR</text><path class="edge" d="M448.6 233.6A210 210 0 0 1 616.9 111.3" marker-end="url(#the-harness-improvement--arrow)"/><circle cx="440" cy="255" r="9" fill="var(--af-product-hangar, #24C1C9)"/><text class="name" x="414.27813157801774" y="251.1064311812611" text-anchor="end">5  Promote</text><text class="body" x="414.27813157801774" y="277.1064311812611" text-anchor="end">move stable; drift checks guard it</text></svg>
