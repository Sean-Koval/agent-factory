<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1104" role="img" aria-label="A ticket's journey, stacked">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #424242); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="journey-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="420" height="1104"/>
<style>
  .af-d .step { fill: var(--af-canvas, #000000); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .stepn { font: 500 11px "DM Mono", ui-monospace, Menlo, monospace; fill: var(--af-fg, #FFFFFF); }
  .af-d .hub-lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
</style>
<text class="title" x="20" y="44" text-anchor="start">A ticket's journey</text><text class="lbl" x="20" y="68" text-anchor="start">SOLID: ON MAIN  ·  DASHED: HANGAR WIRING OPEN</text><rect class="box" x="20" y="100" width="350" height="104" rx="3"/><text class="lbl" x="38" y="126">DOORS</text><text class="name-s" x="38" y="148">Ready for agent</text><text class="body" x="38" y="170">A ticket moves; a signed webhook</text><text class="body" x="38" y="188">reaches hangar</text><circle class="step" cx="348" cy="122" r="9"/><text class="stepn" x="348" y="126" text-anchor="middle">1</text><rect class="box" x="20" y="238" width="350" height="104" rx="3"/><rect x="20" y="238" width="350" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="38" y="264">HANGAR · INTAKE</text><text class="name-s" x="38" y="286">Admit</text><text class="body" x="38" y="308">Tainted: ticket text is untrusted</text><text class="body" x="38" y="326">Within budget and reviewer capacity</text><circle class="step" cx="348" cy="260" r="9"/><text class="stepn" x="348" y="264" text-anchor="middle">2</text><path class="edge" d="M60 204V236" marker-end="url(#journey-stacked-arrow)"/><rect class="box" x="20" y="376" width="350" height="104" rx="3"/><rect x="20" y="376" width="350" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="38" y="402">HANGAR · SANDBOX</text><text class="name-s" x="38" y="424">Claim team-default@stable</text><text class="body" x="38" y="446">The manifest records harness_digest</text><text class="body" x="38" y="464">Every step streams into a trace</text><circle class="step" cx="348" cy="398" r="9"/><text class="stepn" x="348" y="402" text-anchor="middle">3</text><path class="edge" d="M60 342V374" marker-end="url(#journey-stacked-arrow)"/><rect class="box-plan" x="20" y="514" width="350" height="104" rx="3"/><rect x="20" y="514" width="350" height="2" fill="var(--af-product-tower, #C5A93B)"/><text class="lbl" x="38" y="540">TOWER · GOVERN</text><text class="name-s" x="38" y="562">Ask before a risky step</text><text class="body" x="38" y="584">Allow, deny or wait, with a receipt</text><text class="body" x="38" y="602">A wait goes to someone else</text><circle class="step" cx="348" cy="536" r="9"/><text class="stepn" x="348" y="540" text-anchor="middle">4</text><path class="edge-plan" d="M60 480V512" marker-end="url(#journey-stacked-arrow)"/><rect class="box" x="20" y="652" width="350" height="104" rx="3"/><rect x="20" y="652" width="350" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="38" y="678">HANGAR · GATEWAY</text><text class="name-s" x="38" y="700">Verify and open the PR</text><text class="body" x="38" y="722">Repo checks, one commit, a draft PR</text><text class="body" x="38" y="740">A second human approves the commit</text><circle class="step" cx="348" cy="674" r="9"/><text class="stepn" x="348" y="678" text-anchor="middle">5</text><path class="edge-plan" d="M60 618V650" marker-end="url(#journey-stacked-arrow)"/><rect class="box" x="20" y="790" width="350" height="104" rx="3"/><text class="lbl" x="38" y="816">OUTBOX · COMPACTOR</text><text class="name-s" x="38" y="838">Captured once</text><text class="body" x="38" y="860">The run lands in the GCS outbox</text><text class="body" x="38" y="878">and in Parquet overnight</text><circle class="step" cx="348" cy="812" r="9"/><text class="stepn" x="348" y="816" text-anchor="middle">6</text><path class="edge" d="M60 756V788" marker-end="url(#journey-stacked-arrow)"/><rect class="box" x="20" y="928" width="350" height="104" rx="3"/><rect x="20" y="928" width="350" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="38" y="954">FLIGHTDECK · HARNESS REPO</text><text class="name-s" x="38" y="976">Judge, then promote</text><text class="body" x="38" y="998">Stable vs candidate on pinned trials</text><text class="body" x="38" y="1016">A different person moves stable</text><circle class="step" cx="348" cy="950" r="9"/><text class="stepn" x="348" y="954" text-anchor="middle">7</text><path class="edge" d="M60 894V926" marker-end="url(#journey-stacked-arrow)"/><path class="edge" d="M370 980H392V428H372" marker-end="url(#journey-stacked-arrow)"/><text class="elabel" x="406" y="704" text-anchor="middle" transform="rotate(-90 406 704)">the next claim uses the new stable</text><text class="elabel" x="20" y="1066" text-anchor="start">Tower's side is built; hangar's wiring is</text><text class="elabel" x="20" y="1084" text-anchor="start">hangar#172 and #173.</text></svg>
