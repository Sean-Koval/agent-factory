<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="A ticket's journey">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #424242); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="journey-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1200" height="660"/><pattern id="journey-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle class="dot" cx="4" cy="4" r="1.1"/></pattern><rect x="900" y="20" width="300" height="70" fill="url(#journey-dots)"/>
<style>
  .af-d .step { fill: var(--af-canvas, #000000); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .stepn { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; fill: var(--af-fg, #FFFFFF); }
  .af-d .hub-lbl { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
</style>
<text class="title" x="40" y="48" text-anchor="start">A ticket's journey</text><text class="lbl" x="40" y="72" text-anchor="start">SEVEN STEPS  ·  SOLID: ON MAIN  ·  DASHED: TOWER BUILT, HANGAR WIRING OPEN</text><rect class="box" x="250" y="96" width="620" height="104" rx="3"/><rect x="250" y="96" width="620" height="2" fill="var(--af-product-tower, #C5A93B)"/><text class="lbl" x="268" y="122">TOWER · GOVERN</text><text class="name-s" x="268" y="144">Decision point</text><text class="body" x="268" y="166">Answers allow, deny or wait, and signs a receipt</text><text class="body" x="268" y="184">A wait goes to an approver who is not the requester</text><rect class="box" x="40" y="250" width="170" height="170" rx="3"/><text class="lbl" x="58" y="276">MANY DOORS</text><text class="name-s" x="58" y="298">Doors</text><text class="body" x="58" y="320">Jira, GitHub, Slack,</text><text class="body" x="58" y="338">MCP, schedules</text><rect class="box-hub" x="250" y="250" width="620" height="170" rx="3"/><rect x="250" y="250" width="620" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="hub-lbl" x="266" y="408" text-anchor="start">HANGAR · RUN</text><rect class="box-ext" x="266" y="280" width="180" height="112" rx="3"/><text class="lbl" x="284" y="306">INTAKE</text><text class="name-s" x="284" y="328">Admit</text><text class="body" x="284" y="350">Signed webhook; tainted</text><text class="body" x="284" y="368">Budget and review cap</text><rect class="box-ext" x="468" y="280" width="180" height="112" rx="3"/><text class="lbl" x="486" y="306">SANDBOX</text><text class="name-s" x="486" y="328">Claim</text><text class="body" x="486" y="350">team-default@stable</text><text class="body" x="486" y="368">harness_digest, trace</text><rect class="box-ext" x="670" y="280" width="180" height="112" rx="3"/><text class="lbl" x="688" y="306">VERIFY · GATEWAY</text><text class="name-s" x="688" y="328">Deliver</text><text class="body" x="688" y="350">The repo's own checks</text><text class="body" x="688" y="368">One commit, a draft PR</text><rect class="box" x="910" y="250" width="250" height="170" rx="3"/><text class="lbl" x="928" y="276">GITHUB</text><text class="name-s" x="928" y="298">One gate: the PR</text><text class="body" x="928" y="320">Review packet, Harness-Digest</text><text class="body" x="928" y="338">A second human approves</text><text class="body" x="928" y="356">the exact commit</text><rect class="box" x="40" y="500" width="170" height="120" rx="3"/><text class="lbl" x="58" y="526">DEFINE</text><text class="name-s" x="58" y="548">Harness repo</text><text class="body" x="58" y="570">harness.lock</text><text class="body" x="58" y="588">channels.yaml</text><text class="body" x="58" y="606">promotion by PR</text><rect class="box" x="250" y="500" width="190" height="120" rx="3"/><rect x="250" y="500" width="190" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="268" y="526">FLIGHTDECK · JUDGE</text><text class="name-s" x="268" y="548">Judge</text><text class="body" x="268" y="570">Parquet and DuckDB</text><text class="body" x="268" y="588">stable vs candidate</text><text class="body" x="268" y="606">on pinned trials</text><rect class="box" x="465" y="500" width="190" height="120" rx="3"/><rect x="465" y="500" width="190" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="483" y="526">CLOUD RUN · NIGHTLY</text><text class="name-s" x="483" y="548">Compactor</text><text class="body" x="483" y="570">Outbox to Parquet</text><text class="body" x="483" y="588">flightdeck.parquet/v1</text><rect class="box" x="680" y="500" width="190" height="120" rx="3"/><text class="lbl" x="698" y="526">GCS</text><text class="name-s" x="698" y="548">Run outbox</text><text class="body" x="698" y="570">Each run written once</text><text class="body" x="698" y="588">run.json last</text><path class="edge" d="M210 336H264" marker-end="url(#journey-arrow)"/><circle class="step" cx="237" cy="320" r="9"/><text class="stepn" x="237" y="324" text-anchor="middle">1</text><path class="edge" d="M446 336H466" marker-end="url(#journey-arrow)"/><path class="edge" d="M648 336H668" marker-end="url(#journey-arrow)"/><circle class="step" cx="430" cy="298" r="9"/><text class="stepn" x="430" y="302" text-anchor="middle">2</text><circle class="step" cx="632" cy="298" r="9"/><text class="stepn" x="632" y="302" text-anchor="middle">3</text><path class="edge" d="M850 336H908" marker-end="url(#journey-arrow)"/><circle class="step" cx="880" cy="320" r="9"/><text class="stepn" x="880" y="324" text-anchor="middle">5</text><path class="edge-plan" d="M346 200V278" marker-end="url(#journey-arrow)"/><path class="edge-plan" d="M366 280V202" marker-end="url(#journey-arrow)"/><path class="edge-plan" d="M548 200V278" marker-end="url(#journey-arrow)"/><path class="edge-plan" d="M568 280V202" marker-end="url(#journey-arrow)"/><path class="edge-plan" d="M750 200V278" marker-end="url(#journey-arrow)"/><path class="edge-plan" d="M770 280V202" marker-end="url(#journey-arrow)"/><text class="elabel" x="340" y="236" text-anchor="end">decide</text><text class="elabel" x="372" y="236" text-anchor="start">receipt</text><circle class="step" cx="590" cy="236" r="9"/><text class="stepn" x="590" y="240" text-anchor="middle">4</text><path class="edge" d="M760 392V498" marker-end="url(#journey-arrow)"/><circle class="step" cx="778" cy="470" r="9"/><text class="stepn" x="778" y="474" text-anchor="middle">6</text><text class="elabel" x="750" y="470" text-anchor="end">every run</text><path class="edge" d="M680 560H657" marker-end="url(#journey-arrow)"/><path class="edge" d="M465 560H442" marker-end="url(#journey-arrow)"/><path class="edge" d="M250 560H212" marker-end="url(#journey-arrow)"/><circle class="step" cx="231" cy="544" r="9"/><text class="stepn" x="231" y="548" text-anchor="middle">7</text><path class="edge" d="M190 500V460H558V394" marker-end="url(#journey-arrow)"/><text class="elabel" x="222" y="452" text-anchor="start">the next claim uses the new stable</text><text class="lbl" x="910" y="530" text-anchor="start">NUMBERS MATCH THE STEPS</text><text class="lbl" x="910" y="548" text-anchor="start">IN THE TEXT</text><text class="elabel" x="910" y="578" text-anchor="start">Tower's side is built; hangar's</text><text class="elabel" x="910" y="596" text-anchor="start">wiring is hangar#172 and #173</text></svg>
