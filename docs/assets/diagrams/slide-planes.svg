<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-label="Four planes, one loop">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot, #262626); }
</style>
<defs><marker id="four-planes,-one-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1280" height="610"/>
<style>
  .af-d .name { font-size: 22px; }
  .af-d .body { font-size: 16px; }
  .af-d .lbl { font-size: 12.5px; }
  .af-d .elabel { font-size: 15px; }
</style>
<rect class="box" x="40" y="20" width="330" height="150" rx="3"/><text class="lbl" x="62" y="52">DOORS</text><text class="name" x="62" y="84">Many doors</text><text class="body" x="62" y="114">Jira, GitHub, Slack, MCP,</text><text class="body" x="62" y="138">schedules</text><rect class="box" x="40" y="230" width="330" height="150" rx="3"/><rect x="40" y="230" width="330" height="3" fill="var(--af-p-aidlc, #69C27E)"/><text class="lbl" x="62" y="262">AI-DLC + HARNESS REPO</text><text class="name" x="62" y="294">Define</text><text class="body" x="62" y="324">harness.lock, one digest,</text><text class="body" x="62" y="348">the workflow plugin</text><rect class="box-hub" x="470" y="120" width="340" height="260" rx="3"/><rect x="470" y="120" width="340" height="3" fill="var(--af-p-hangar, #EE8F63)"/><text class="lbl" x="492" y="152">HANGAR</text><text class="name" x="492" y="184">Run</text><text class="body" x="492" y="214">Sandboxes, sessions, jobs</text><text class="body" x="492" y="238">and trials on GKE</text><text class="body" x="492" y="262">Verify, push through the</text><text class="body" x="492" y="286">gateway, land on approval</text><rect class="box" x="910" y="20" width="330" height="150" rx="3"/><rect x="910" y="20" width="330" height="3" fill="var(--af-p-workspace, #C5A93B)"/><text class="lbl" x="932" y="52">TOWER</text><text class="name" x="932" y="84">Govern</text><text class="body" x="932" y="114">Rules, human approvals,</text><text class="body" x="932" y="138">signed receipts</text><rect class="box" x="910" y="230" width="330" height="150" rx="3"/><text class="lbl" x="932" y="262">GITHUB</text><text class="name" x="932" y="294">One gate: the PR</text><text class="body" x="932" y="324">A second human approves</text><text class="body" x="932" y="348">the exact commit</text><rect class="box" x="470" y="440" width="340" height="150" rx="3"/><rect x="470" y="440" width="340" height="3" fill="var(--af-p-flightdeck, #D98CD2)"/><text class="lbl" x="492" y="472">FLIGHTDECK</text><text class="name" x="492" y="504">Judge</text><text class="body" x="492" y="534">Paired statistics and</text><text class="body" x="492" y="558">behavior specs on every run</text><path class="edge" d="M370 95H420V180H468" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="380" y="85" text-anchor="start">work</text><path class="edge" d="M370 305H468" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="380" y="295" text-anchor="start">lock</text><path class="edge" d="M810 165H860V95H908" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="820" y="155" text-anchor="start">decide</text><path class="edge" d="M908 130H880V200H812" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="888" y="230" text-anchor="start"></text><path class="edge" d="M810 305H908" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="820" y="295" text-anchor="start">PR</text><path class="edge" d="M560 380V438" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="572" y="418" text-anchor="start">every run</text><path class="edge" d="M720 440V382" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="708" y="418" text-anchor="end">trials</text><path class="edge" d="M470 515H205V382" marker-end="url(#four-planes,-one-loop-arrow)"/><text class="elabel" x="215" y="505" text-anchor="start">promote the next harness</text></svg>
