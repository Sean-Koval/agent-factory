<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 736" role="img" aria-label="System context">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #424242); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="system-context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1200" height="736"/><pattern id="system-context-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle class="dot" cx="4" cy="4" r="1.1"/></pattern><rect x="900" y="20" width="300" height="70" fill="url(#system-context-dots)"/><text class="title" x="40" y="48" text-anchor="start">System context</text><text class="lbl" x="40" y="72" text-anchor="start">C4 LEVEL 1  ·  WHO USES THE SUITE AND WHAT IT DEPENDS ON</text><rect class="person" x="40" y="110" width="210" height="104" rx="3"/><text class="lbl" x="58" y="136">PERSON</text><text class="name-s" x="58" y="158">Reviewer</text><text class="body" x="58" y="180">Reviews agent PRs and</text><text class="body" x="58" y="198">approves the exact commit</text><rect class="person" x="380" y="110" width="210" height="104" rx="3"/><text class="lbl" x="398" y="136">PERSON</text><text class="name-s" x="398" y="158">Engineer</text><text class="body" x="398" y="180">Hands work to agents and</text><text class="body" x="398" y="198">steers ~10 sessions</text><rect class="person" x="610" y="110" width="210" height="104" rx="3"/><text class="lbl" x="628" y="136">PERSON</text><text class="name-s" x="628" y="158">Harness owner</text><text class="body" x="628" y="180">Runs experiments and</text><text class="body" x="628" y="198">promotes the harness</text><rect class="person" x="950" y="110" width="210" height="104" rx="3"/><text class="lbl" x="968" y="136">PERSON</text><text class="name-s" x="968" y="158">Approver</text><text class="body" x="968" y="180">Decides release, landing,</text><text class="body" x="968" y="198">egress and secrets</text><rect class="box-hub" x="380" y="300" width="440" height="170" rx="3"/><text class="lbl" x="398" y="326">SOFTWARE SYSTEM</text><text class="name" x="398" y="348">Agent factory</text><text class="body" x="398" y="370">Defines, runs, judges and governs cloud coding agents</text><text class="body" x="398" y="388">hangar · flightdeck · Tower · ai-dlc</text><text class="body" x="398" y="406">Every change leaves through a reviewed pull request</text><rect class="box-ext" x="40" y="300" width="210" height="104" rx="3"/><text class="lbl" x="58" y="326">EXTERNAL SYSTEM</text><text class="name-s" x="58" y="348">GitHub</text><text class="body" x="58" y="370">Repos, PRs, checks, App,</text><text class="body" x="58" y="388">labels, Projects columns</text><rect class="box-ext" x="40" y="454" width="210" height="104" rx="3"/><text class="lbl" x="58" y="480">EXTERNAL SYSTEM</text><text class="name-s" x="58" y="502">Jira</text><text class="body" x="58" y="524">Tickets moved to</text><text class="body" x="58" y="542">“Ready for agent”</text><rect class="box-ext" x="950" y="300" width="210" height="104" rx="3"/><text class="lbl" x="968" y="326">EXTERNAL SYSTEM</text><text class="name-s" x="968" y="348">Slack</text><text class="body" x="968" y="370">Requests and questions,</text><text class="body" x="968" y="388">approval cards, digests</text><rect class="box-ext" x="950" y="454" width="210" height="104" rx="3"/><text class="lbl" x="968" y="480">EXTERNAL SYSTEM</text><text class="name-s" x="968" y="502">Model providers</text><text class="body" x="968" y="524">Anthropic, OpenAI, Google</text><text class="body" x="968" y="542">APIs, with API keys</text><rect class="box-ext" x="380" y="600" width="210" height="104" rx="3"/><text class="lbl" x="398" y="626">EXTERNAL SYSTEM</text><text class="name-s" x="398" y="648">Google Cloud</text><text class="body" x="398" y="670">GKE, Cloud Storage,</text><text class="body" x="398" y="688">Cloud Run, registry</text><rect class="box-ext" x="610" y="600" width="210" height="104" rx="3"/><text class="lbl" x="628" y="626">EXTERNAL SYSTEM</text><text class="name-s" x="628" y="648">MCP servers</text><text class="body" x="628" y="670">Spaceport data products,</text><text class="body" x="628" y="688">internal tools, docs</text><path class="edge" d="M145 214V298" marker-end="url(#system-context-arrow)"/><text class="elabel" x="157" y="262" text-anchor="start">approves PRs</text><path class="edge" d="M485 214V298" marker-end="url(#system-context-arrow)"/><text class="elabel" x="497" y="248" text-anchor="start">hands off work,</text><text class="elabel" x="497" y="266" text-anchor="start">answers questions</text><path class="edge" d="M715 214V298" marker-end="url(#system-context-arrow)"/><text class="elabel" x="703" y="248" text-anchor="end">promotes</text><text class="elabel" x="703" y="266" text-anchor="end">harnesses</text><path class="edge" d="M1055 214V250H790V298" marker-end="url(#system-context-arrow)"/><text class="elabel" x="1043" y="240" text-anchor="end">decides risky actions</text><path class="edge" d="M380 334H252" marker-end="url(#system-context-arrow)"/><text class="elabel" x="316" y="326" text-anchor="middle">pushes, opens PRs</text><path class="edge" d="M250 380H378" marker-end="url(#system-context-arrow)"/><text class="elabel" x="314" y="400" text-anchor="middle">webhooks</text><path class="edge" d="M250 506H314V444H378" marker-end="url(#system-context-arrow)"/><text class="elabel" x="322" y="482" text-anchor="start">webhooks</text><path class="edge" d="M820 334H948" marker-end="url(#system-context-arrow)"/><text class="elabel" x="884" y="326" text-anchor="middle">questions</text><path class="edge" d="M950 380H822" marker-end="url(#system-context-arrow)"/><text class="elabel" x="886" y="400" text-anchor="middle">requests</text><path class="edge" d="M820 444H886V506H948" marker-end="url(#system-context-arrow)"/><text class="elabel" x="878" y="482" text-anchor="end">model calls</text><path class="edge" d="M485 470V598" marker-end="url(#system-context-arrow)"/><text class="elabel" x="497" y="540" text-anchor="start">runs on</text><path class="edge" d="M715 470V598" marker-end="url(#system-context-arrow)"/><text class="elabel" x="727" y="540" text-anchor="start">calls tools</text></svg>
