<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-label="Containers and where they run">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #424242); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 12px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="containers-and-where-the-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1200" height="1020"/><text class="title" x="40" y="48" text-anchor="start">Containers and where they run</text><text class="lbl" x="40" y="72" text-anchor="start">C4 LEVEL 2  ·  SOLID: ON MAIN  ·  DASHED: PLANNED OR NOT YET WIRED</text><rect class="bound" x="30" y="100" width="240" height="460" rx="4"/><text class="lbl" x="46" y="124" text-anchor="start">ENGINEER MACHINE AND CI</text><rect class="box" x="46" y="150" width="208" height="104" rx="3"/><text class="lbl" x="64" y="176">CLI · MCP</text><text class="name-s" x="64" y="198">Agent client</text><text class="body" x="64" y="220">Claude Code or Codex</text><text class="body" x="64" y="238">with the hangar MCP</text><rect class="box" x="46" y="290" width="208" height="104" rx="3"/><rect x="46" y="290" width="208" height="2" fill="var(--af-product-aidlc, #69C27E)"/><text class="lbl" x="64" y="316">PYTHON CLI</text><text class="name-s" x="64" y="338">ai-dlc</text><text class="body" x="64" y="360">Machine setup, local work</text><text class="body" x="64" y="378">lifecycle, workflow plugin</text><rect class="box" x="46" y="430" width="208" height="104" rx="3"/><rect x="46" y="430" width="208" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="64" y="456">PYTHON CLI · DUCKDB</text><text class="name-s" x="64" y="478">flightdeck</text><text class="body" x="64" y="500">Ingest, statistics, specs,</text><text class="body" x="64" y="518">reports, experiments</text><rect class="bound" x="330" y="100" width="560" height="850" rx="4"/><text class="lbl" x="346" y="124" text-anchor="start">GOOGLE CLOUD PROJECT</text><rect class="bound" x="346" y="140" width="528" height="500" rx="4"/><text class="lbl" x="362" y="164" text-anchor="start">GKE CLUSTER</text><rect class="box-hub" x="362" y="180" width="220" height="264" rx="3"/><rect x="362" y="180" width="220" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="380" y="206">PYTHON · ALWAYS ON</text><text class="name-s" x="380" y="228">hangar control plane</text><text class="body" x="380" y="250">REST, MCP and web UI :8787</text><text class="body" x="380" y="268">Jobs, sessions, intake</text><text class="body" x="380" y="286">Landing and the inbox</text><text class="body" x="380" y="304">SQLite on a persistent disk</text><text class="body" x="380" y="322">Writes the run outbox</text><rect class="box" x="650" y="180" width="208" height="124" rx="3"/><rect x="650" y="180" width="208" height="2" fill="var(--af-product-tower, #C5A93B)"/><text class="lbl" x="668" y="206">ON MAIN · NOT DEPLOYED</text><text class="name-s" x="668" y="228">Tower</text><text class="body" x="668" y="250">Decision point, approvals,</text><text class="body" x="668" y="268">receipts, passports</text><rect class="box" x="650" y="340" width="208" height="104" rx="3"/><rect x="650" y="340" width="208" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="668" y="366">CONTROL PLANE POD</text><text class="name-s" x="668" y="388">Gateway and egress</text><text class="body" x="668" y="410">Git gateway :8788</text><text class="body" x="668" y="428">Egress proxy :3128</text><rect class="box" x="362" y="500" width="496" height="112" rx="3"/><rect x="362" y="500" width="496" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="380" y="526">AGENT SANDBOX ADD-ON</text><text class="name-s" x="380" y="548">Agent sandboxes</text><text class="body" x="380" y="570">Claude Code, Codex, pi, Antigravity · gVisor on Spot nodes, 0 to N</text><text class="body" x="380" y="588">Pools off 01:00–10:00 ET · optional Kata heavy tier for Docker</text><rect class="box" x="346" y="670" width="528" height="124" rx="3"/><text class="lbl" x="364" y="696">CLOUD STORAGE · ARTIFACT REGISTRY FOR IMAGES</text><text class="name-s" x="364" y="718">Storage</text><text class="body" x="364" y="740">Checkpoints: session state that outlives the disk</text><text class="body" x="364" y="758">Run outbox: hangar.run/v1, written once · off in the deploy</text><text class="body" x="364" y="776">Data plane: Parquet tables, one folder a day</text><rect class="box" x="346" y="826" width="528" height="104" rx="3"/><rect x="346" y="826" width="528" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="364" y="852">CLOUD RUN JOB · NIGHTLY · NOT DEPLOYED</text><text class="name-s" x="364" y="874">Compactor</text><text class="body" x="364" y="896">Flattens new runs into Parquet each night, while the sandbox pools are off</text><rect class="box-ext" x="940" y="150" width="230" height="104" rx="3"/><text class="lbl" x="958" y="176">EXTERNAL</text><text class="name-s" x="958" y="198">Jira and Slack</text><text class="body" x="958" y="220">Doors in; questions and</text><text class="body" x="958" y="238">approvals out</text><rect class="box-ext" x="940" y="340" width="230" height="104" rx="3"/><text class="lbl" x="958" y="366">EXTERNAL</text><text class="name-s" x="958" y="388">GitHub</text><text class="body" x="958" y="410">Team repos, PRs, the App,</text><text class="body" x="958" y="428">the team harness repo</text><rect class="box-ext" x="940" y="470" width="230" height="104" rx="3"/><text class="lbl" x="958" y="496">EXTERNAL</text><text class="name-s" x="958" y="518">Model providers</text><text class="body" x="958" y="540">Reached only through</text><text class="body" x="958" y="558">the egress allowlist</text><rect class="box-ext" x="940" y="600" width="230" height="104" rx="3"/><rect x="940" y="600" width="230" height="2" fill="var(--af-product-spaceport, #B199F4)"/><text class="lbl" x="958" y="626">EXTERNAL</text><text class="name-s" x="958" y="648">MCP servers</text><text class="body" x="958" y="670">Spaceport, internal tools,</text><text class="body" x="958" y="688">bound at claim time</text><path class="edge" d="M254 222H360" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="262" y="214" text-anchor="start">MCP / REST</text><path class="edge" d="M254 470H300V300H360" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="306" y="292" text-anchor="start">trials</text><path class="edge" d="M254 510H316V980H1190V732H876" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="750" y="1000" text-anchor="middle">flightdeck reads Parquet</text><path class="edge-plan" d="M582 240H648" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="616" y="232" text-anchor="middle">decide</text><path class="edge" d="M472 444V498" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="480" y="476" text-anchor="start">creates</text><path class="edge" d="M754 500V446" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="762" y="478" text-anchor="start">git, egress</text><path class="edge" d="M362 420H354V652H430V668" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="438" y="652" text-anchor="start">checkpoints, runs</text><path class="edge-plan" d="M520 794V824" marker-end="url(#containers-and-where-the-arrow)"/><path class="edge-plan" d="M700 826V796" marker-end="url(#containers-and-where-the-arrow)"/><path class="edge" d="M858 380H938" marker-end="url(#containers-and-where-the-arrow)"/><text class="elabel" x="866" y="372" text-anchor="start">push</text><path class="edge" d="M858 420H916V522H938" marker-end="url(#containers-and-where-the-arrow)"/><path class="edge" d="M858 580H902V652H938" marker-end="url(#containers-and-where-the-arrow)"/><path class="edge" d="M1170 392H1184V88H472V178" marker-end="url(#containers-and-where-the-arrow)"/><path class="edge" d="M1170 202H1184"/><text class="elabel" x="1176" y="80" text-anchor="end">webhooks from GitHub, Jira and Slack</text></svg>
