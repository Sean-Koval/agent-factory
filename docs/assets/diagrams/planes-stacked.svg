<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1052" role="img" aria-label="The agent factory at a glance, stacked">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #424242); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .bound-fill { fill: var(--af-surface, #0A0A0A); }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .lbl-hi { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-brand-text, #FFC400); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="planes-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="420" height="1052"/><text class="title" x="20" y="44" text-anchor="start">The agent factory at a glance</text><text class="lbl" x="20" y="68" text-anchor="start">Define  ·  Run  ·  Judge  ·  Govern</text><rect class="box" x="20" y="100" width="350" height="124" rx="12"/><text class="lbl" x="38" y="126">The team harness repo</text><text class="name-s" x="38" y="148">Define</text><text class="body" x="38" y="170">Native files and harness.lock,</text><text class="body" x="38" y="188">frozen from a good hangar run</text><text class="body" x="38" y="206">One identity: harness_digest</text><text class="elabel" x="74" y="250" text-anchor="start">pinned as harness.lock</text><path class="edge" d="M60 224V262" marker-end="url(#planes-stacked-arrow)"/><rect class="box-hub" x="20" y="264" width="350" height="142" rx="12"/><clipPath id="pe20-264-350-142"><rect x="20" y="264" width="350" height="142" rx="12"/></clipPath><rect x="20" y="264" width="350" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#pe20-264-350-142)"/><text class="lbl" x="38" y="290">hangar</text><text class="name-s" x="38" y="312">Run</text><text class="body" x="38" y="334">Work arrives through the doors: Jira,</text><text class="body" x="38" y="352">GitHub, Slack, MCP and schedules</text><text class="body" x="38" y="370">Sandboxes, sessions, jobs and trials</text><text class="body" x="38" y="388">Verify, push through the gateway</text><text class="elabel" x="70" y="432" text-anchor="start">decide, then a receipt</text><rect class="box" x="56" y="446" width="314" height="124" rx="12"/><clipPath id="pe56-446-314-124"><rect x="56" y="446" width="314" height="124" rx="12"/></clipPath><rect x="56" y="446" width="314" height="3" fill="var(--af-product-tower, #67B0F9)" clip-path="url(#pe56-446-314-124)"/><text class="lbl" x="74" y="472">Tower</text><text class="name-s" x="74" y="494">Govern</text><text class="body" x="74" y="516">Rules and human approvals; the</text><text class="body" x="74" y="534">approver is never the requester</text><text class="body" x="74" y="552">Signed receipts; fails closed</text><text class="elabel" x="70" y="596" text-anchor="start">push one commit, open the PR</text><rect class="box" x="56" y="610" width="314" height="106" rx="12"/><text class="lbl" x="74" y="636">GitHub</text><text class="name-s" x="74" y="658">One gate: the PR</text><text class="body" x="74" y="680">Tainted work opens as a draft</text><text class="body" x="74" y="698">A second human approves the SHA</text><text class="elabel" x="70" y="742" text-anchor="start">every run, through the outbox</text><rect class="box" x="56" y="756" width="314" height="124" rx="12"/><clipPath id="pe56-756-314-124"><rect x="56" y="756" width="314" height="124" rx="12"/></clipPath><rect x="56" y="756" width="314" height="3" fill="var(--af-product-flightdeck, #D98CD2)" clip-path="url(#pe56-756-314-124)"/><text class="lbl" x="74" y="782">flightdeck</text><text class="name-s" x="74" y="804">Judge</text><text class="body" x="74" y="826">Reads runs from a Parquet data plane</text><text class="body" x="74" y="844">Paired statistics, behavior specs</text><text class="body" x="74" y="862">Reports and evidence on PRs</text><path class="edge" d="M34 406V818"/><path class="edge" d="M34 508H54" marker-end="url(#planes-stacked-arrow)"/><path class="edge" d="M34 663H54" marker-end="url(#planes-stacked-arrow)"/><path class="edge" d="M34 818H54" marker-end="url(#planes-stacked-arrow)"/><path class="edge" d="M370 818H392V162H372" marker-end="url(#planes-stacked-arrow)"/><text class="elabel" x="406" y="490" text-anchor="middle" transform="rotate(-90 406 490)">report, then promote the next harness</text><text class="elabel" x="20" y="926" text-anchor="start">tools over MCP, bound into each sandbox</text><rect class="box-ext" x="20" y="940" width="350" height="88" rx="12"/><clipPath id="pe20-940-350-88"><rect x="20" y="940" width="350" height="88" rx="12"/></clipPath><rect x="20" y="940" width="350" height="3" fill="var(--af-product-spaceport, #B199F4)" clip-path="url(#pe20-940-350-88)"/><text class="lbl" x="38" y="966">Spaceport and MCP servers</text><text class="name-s" x="38" y="988">Capabilities</text><text class="body" x="38" y="1010">Data products, internal tools and docs search</text></svg>
